name: Build Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: v2.0.1

jobs:
  build:
    # ubuntu-latest is x86_64, which is what the bundled toolchain/ expects.
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (with KernelSU-Next submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev python3 make git cpio zstd xz-utils
          gcc --version | head -1

      - name: Verify toolchain + submodule
        run: |
          set -euo pipefail
          ./toolchain/clang/host/linux-x86/clang-r383902/bin/clang --version | head -2
          test -e drivers/kernelsu/Kconfig || {
            echo "::error::drivers/kernelsu is a broken link (KernelSU-Next not checked out)"
            exit 1
          }
          echo "KernelSU-Next: $(git -C KernelSU-Next describe --tags 2>/dev/null || echo unknown)"

      - name: Report free disk space
        run: df -h /

      - name: Build
        run: |
          set -euo pipefail
          ./build_kernel.sh 2>&1 | tee build.log
          test -f out/arch/arm64/boot/Image

      - name: Report artifacts
        if: always()
        run: |
          df -h /
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || echo "no Image produced"
          file out/arch/arm64/boot/Image 2>/dev/null || true
          tail -40 build.log || true

      - name: Package flashable zip
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp -a anykernel/. "$stage/"
          cp out/arch/arm64/boot/Image.gz "$stage/Image.gz"
          ( cd "$stage" && zip -q -r -9 "$GITHUB_WORKSPACE/KSUN_SUSFS_A22_Kernel.zip" . )
          ls -lh KSUN_SUSFS_A22_Kernel.zip
          unzip -l KSUN_SUSFS_A22_Kernel.zip
          ls -lh KSUN_SUSFS_A22_Kernel.zip
          unzip -l KSUN_SUSFS_A22_Kernel.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: KSUN_SUSFS_A22_Kernel
          path: KSUN_SUSFS_A22_Kernel.zip
          # artifact name stays stable; the release asset is per-run
          if-no-files-found: error
          retention-days: 30

      - name: Publish zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ env.RELEASE_TAG }}
          RUN_NUMBER: ${{ github.run_number }}
          SHORT_SHA: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          tag="${BASE_TAG}-build.${RUN_NUMBER}"
          zip="KSUN_SUSFS_A22_Kernel_build${RUN_NUMBER}.zip"

          cp KSUN_SUSFS_A22_Kernel.zip "$zip"

          cat > notes.md <<'NOTES_EOF'
          Flashable AnyKernel3 zip for SM-A225F/A225M.

          Contents:
            - Image.gz   gzip-compressed kernel Image
            - anykernel.sh, META-INF, tools, modules, patch, ramdisk
              AnyKernel3 installer shell

          Flash with AnyKernel3 in recovery, or extract and repack via Kitchen.

          Kernel: Linux 4.14.186 (arm64, MediaTek MT6768)
          KSU: Mafiadan6/KernelSU-Next @ legacy-susfs-v2-nosusfsextra, version 33227
          susfs: v2.0.0 code (the SUSFS_VERSION string reads v2.2.0, which is a label only)
          NoMount: vfs path redirection, built in as CONFIG_NOMOUNT=y

          Pair with the KernelSU manager matching the version above.

          Local KSU fixes carried over sidex15/legacy-susfs-v2:
            - call susfs_run_sus_path_loop(new_uid) directly instead of
              deferring to the susfs_extra_works workqueue, which this
              kernel does not define
            - route strscpy_pad through the __strscpy_pad compat wrapper,
              since strscpy_pad only exists from Linux 5.8

          NoMount notes:
            The kernel side of the subsystem is included here. Its WebUI and
            module management are a separate KernelSU metamodule, installed
            from the maxsteeel/nomount releases after flashing.
          NOTES_EOF
          {
            printf 'Build #%s from commit %s\n\n' "$RUN_NUMBER" "$SHORT_SHA"
            cat notes.md
          } > release-notes.md

          gh release create "$tag" "$zip" \
            --title "A225f-T-s9 Kernel - build $RUN_NUMBER" \
            --notes-file release-notes.md

          gh release view "$tag" --json url,assets \
            --jq '.url, (.assets[]|.name+" "+((.size/1048576)|floor|tostring)+" MB")'

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-a225f
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Remove build output
        run: |
          set -euo pipefail
          size_before="$(du -sh out 2>/dev/null | cut -f1 || echo unknown)"
          echo "out/ before cleanup: ${size_before:-none}"
          rm -rf out
          df -h /
          echo "::notice::Removed out/ (${size_before:-n/a}) after upload"