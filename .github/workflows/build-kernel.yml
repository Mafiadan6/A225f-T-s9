name: Build Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: v2.0.0

jobs:
  build:
    # ubuntu-latest is x86_64, which is what the bundled toolchain/ expects.
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (with KernelSU-Next submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev python3 make git cpio zstd xz-utils
          gcc --version | head -1

      - name: Verify toolchain + submodule
        run: |
          set -euo pipefail
          ./toolchain/clang/host/linux-x86/clang-r383902/bin/clang --version | head -2
          test -e drivers/kernelsu/Kconfig || {
            echo "::error::drivers/kernelsu is a broken link (KernelSU-Next not checked out)"
            exit 1
          }
          echo "KernelSU-Next: $(git -C KernelSU-Next describe --tags 2>/dev/null || echo unknown)"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build
        run: |
          set -euo pipefail
          ./build_kernel.sh 2>&1 | tee build.log
          test -f out/arch/arm64/boot/Image

      - name: Report artifacts
        if: always()
        run: |
          df -h /
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || echo "no Image produced"
          file out/arch/arm64/boot/Image 2>/dev/null || true
          tail -40 build.log || true

      - name: Package flashable zip
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp out/arch/arm64/boot/Image.gz "$stage/image.gz"
          ( cd "$stage" && zip -q -r -9 "$GITHUB_WORKSPACE/KSUN_SUSFS_A22_Kernel.zip" image.gz )
          ls -lh KSUN_SUSFS_A22_Kernel.zip
          unzip -l KSUN_SUSFS_A22_Kernel.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: KSUN_SUSFS_A22_Kernel
          path: KSUN_SUSFS_A22_Kernel.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          notes="Automated build of commit ${{ github.sha }}.

          Contents of the zip:
            - image.gz  (gzip-compressed kernel Image)

          KSU: Mafiadan6/KernelSU-Next @ legacy-susfs-v2-nosusfsextra
          susfs: v2.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KSUN_SUSFS_A22_Kernel.zip --clobber
            echo "::notice::Replaced asset on existing release $TAG"
          else
            gh release create "$TAG" KSUN_SUSFS_A22_Kernel.zip \
              --title "A225f-T-s9 Kernel (KSU + susfs)" \
              --notes "$notes"
            echo "::notice::Created release $TAG"
          fi
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[]|.name+" "+(.size|tostring))'

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-a225f
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7